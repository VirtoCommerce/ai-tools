# Drives vc-secrets against the real credential store of each OS: DPAPI and Credential Manager on Windows,
# the Keychain on macOS, gpg on Linux.
#
# WHY THIS EXISTS. The unit suite cannot reach a real store, by design: it fakes PowerShell, `cmdkey`,
# `security` and `gpg` and points every path at a temp dir, so no CI run had ever touched DPAPI, a real
# file lock, the Keychain or a real gpg. That gap hid a false claim in the design record: a manual run on
# Windows on 2026-11-23 showed that a handle a node process holds open DOES block a rename over the file,
# which the record had said it could not. Nothing but a real OS could have caught it, and a manual run on
# a colleague's machine does not repeat itself for the next change. The scripts under
# .github/smoke/vc-secrets/ are that run, kept so that every future change to the plugin gets it.
#
# WHY A WORKFLOW OF ITS OWN, not a step of unit-tests.yml:
#
#   - unit-tests.yml's property is that it touches no live store. A job that writes to the Credential
#     Manager and the Keychain does not belong beside it.
#   - It runs only when the plugin, the smoke scripts or this file change. The checks pin timing (a lock
#     released after 150 ms, a retry that gives up after five attempts): on a loaded runner they can go
#     red for reasons of the machine, and such a failure must not stop an unrelated PR.
#   - The scripts live outside the plugin directory because that directory is shipped whole to users, and
#     a script that writes to a live store has no place in what they install.
#
# Each script refuses to run unless GITHUB_ACTIONS=true or --local is given, writes under a random
# `vcs-smoke-<hex>` scope, removes it afterwards and reports leftovers. No secrets are used or needed.
#
# BY HAND: `gh workflow run vc-secrets-os-smoke.yml --ref <branch>` (the dispatch trigger works once this
# file is on the default branch), or `node .github/smoke/vc-secrets/<os>.mjs --local` on that OS.
name: vc-secrets OS smoke

on:
  pull_request:
    paths:
      - 'plugins/vc-secrets/**'
      - '.github/smoke/vc-secrets/**'
      - '.github/workflows/vc-secrets-os-smoke.yml'
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: vc-secrets-os-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    # One leg per OS, and one script per leg: the stores have nothing in common. A red leg is a finding
    # on that OS, so none cancels the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: windows
            # cmd, not the default pwsh: the smoke spawns Windows PowerShell 5.1, and a node started
            # from PowerShell 7 hands it PowerShell 7's PSModulePath, which 5.1 then loads modules from.
            shell: cmd
          - os: macos-latest
            script: macos
            shell: bash
          - os: ubuntu-latest
            script: linux
            shell: bash
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, as in unit-tests.yml. No `npm ci`: the plugin and the scripts import nothing but Node's own modules.
          node-version: '22'
      - name: Smoke on ${{ matrix.os }}
        shell: ${{ matrix.shell }}
        run: node .github/smoke/vc-secrets/${{ matrix.script }}.mjs

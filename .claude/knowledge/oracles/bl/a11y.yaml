# yaml-language-server: $schema=../../../../templates/bl.schema.json
domain:
  heading: "Domain 21: Accessibility (BL-A11Y)"
  prefixes:
    - BL-A11Y
  agents:
    - ui-ux-expert
    - qa-frontend-expert
  intro: These invariants hold for any rendered customer-facing surface on the accessibility-gated storefront themes (and, per BL-UI-007, the Admin SPA), and are grounded directly in the WCAG 2.1/2.2 success criteria rather than in Virto documentation, which states no conformance target (bl-audit-criteria §1a class 2 — same basis as BL-UI-006/BL-UI-007). Exercised by `045-accessibility-tests.csv` via axe-core scans, keyboard-only traversal, and accessibility-tree observation.
rules:
  - id: BL-A11Y-001
    title: Keyboard operability and focus management
    rule: On the accessibility-gated storefront themes, every interactive element MUST be reachable and operable via keyboard alone, in a logical DOM/tab order, with a visible focus indicator on the currently focused element (WCAG 2.1.1, 2.4.3, 2.4.7). A modal/dialog overlay MUST contain keyboard focus within itself while open — Tab from its last focusable element cycles to its first, Shift+Tab from the first cycles to the last — and closing it (via Escape or an explicit close control) MUST release the trap and return focus to the triggering control.
    priority: P1-data
    trust: DECLARED
    source:
      - kind: code
        ref: "`client-app/ui-kit/composables/useFocusManagement.ts` — the focusable-elements selector and the Tab-cycle keydown handler that wraps focus at the first/last element when `trapFocus` is enabled; wired into `client-app/ui-kit/components/molecules/dialog/vc-dialog.vue`."
      - kind: doc
        ref: "w3.org/TR/WCAG22#keyboard (SC 2.1.1), #focus-order (SC 2.4.3), #focus-visible (SC 2.4.7) — keyboard operable, logical order, visible focus"
      - kind: doc
        ref: w3.org/TR/WCAG22#no-keyboard-trap (SC 2.1.2) — focus can leave any component
      - kind: resolution
        ref: VCST-5671 (Done) — overflow popover was not keyboard reachable and focus did not move into it; fixed
    scope:
      code_ref: vc-frontend:client-app/ui-kit/composables/useFocusManagement.ts#useFocusManagement
    check:
      kind: manual
      ref: From a neutral starting point, Tab through the surface and confirm every interactive element receives focus in DOM order with a visible focus ring. Open a modal, Tab to its last focusable element and confirm wrap to the first (Shift+Tab from the first wraps to the last). Close it and confirm focus returns to the trigger and Tab no longer reaches the closed modal's contents.
    violation_signal: An element skipped by Tab; `outline:none` with no visible replacement; Tab exits an open modal to page content behind it; focus remains trapped, or does not return to the trigger, after close.
    status: ACTIVE
    verified:
      date: 2026-10-06
      by: REG-2026-10-06-1857
  - id: BL-A11Y-002
    title: Accessible naming and label association
    rule: Every interactive control MUST expose a non-empty, contextual accessible name to assistive technology (WCAG 4.1.2), distinct from a generic element-type label. Every visible field label MUST be programmatically associated with its input via `<label for>`/`aria-labelledby`/`aria-label` (WCAG 1.3.1). Every informative image's `alt` describes its content/purpose; a purely decorative image carries `alt=""` (WCAG 1.1.1).
    priority: P1-data
    trust: DECLARED
    source:
      - kind: code
        ref: "`client-app/shared/cart/components/coupon-card.vue` — Apply/Remove buttons receive a dynamic, contextual `aria-label` from i18n keys via the `VcButton` `ariaLabel` prop, rather than a static generic label; `client-app/shared/wishlists/components/wishlist-card.vue` similarly attaches a contextual `aria-label` to its date block rather than relying on the bare visible date text."
      - kind: doc
        ref: "w3.org/TR/WCAG22#name-role-value (SC 4.1.2), #info-and-relationships (SC 1.3.1), #non-text-content (SC 1.1.1) — accessible names, programmatic label association, alt text"
      - kind: resolution
        ref: VCST-4993 (Done) — checkout address popup search input had a wrong aria-label; fixed
      - kind: resolution
        ref: VCST-5860 (Done) — icon toggle buttons had no accessible name; fixed
    check:
      kind: manual
      ref: Capture the accessibility tree for the surface and confirm every button/link/input exposes a non-generic accessible name; confirm each visible label's `for`/`id` pairing or `aria-labelledby` resolves correctly; confirm `<img alt>` is present and non-generic (or explicitly empty for decorative images). Corroborate with an axe-core scan (`button-name`, `link-name`, `label`, `image-alt`) — zero violations required.
    violation_signal: An icon-only control announced as bare "button"/"link"; an input with no associated label; a product image missing `alt`; `aria-labelledby` referencing a non-existent id.
    status: SUSPECT
    suspect_reason: "[case] MSNF-090 failed in REG-2026-10-01-1243"
  - id: BL-A11Y-003
    title: Color contrast and non-color status differentiation
    rule: On the accessibility-gated storefront themes, body/paragraph text MUST meet contrast ≥ 4.5:1 against its background, and large text (≥18px, or ≥14px bold) ≥ 3:1 (WCAG 1.4.3). UI-component boundaries and meaning-bearing graphical/icon affordances MUST meet ≥ 3:1 against their adjacent background (WCAG 1.4.11). Status/meaning (error, success, warning) MUST NOT be conveyed by color alone (WCAG 1.4.1).
    priority: P1-data
    trust: DECLARED
    source:
      - kind: code
        ref: "`client-app/shared/wishlists/components/wishlist-card.vue` — the card's icon foreground is styled via a semantic design token rather than a raw hex value, routing contrast through the design-token system that governs compliance."
      - kind: doc
        ref: "w3.org/TR/WCAG22#contrast-minimum (SC 1.4.3), #non-text-contrast (SC 1.4.11), #use-of-color (SC 1.4.1) — 4.5:1 / 3:1 contrast; no colour-only meaning"
      - kind: resolution
        ref: VCST-5911 (Done) — storefront status dot below 3:1 and status conveyed by colour alone; fixed
    check:
      kind: manual
      ref: Run an axe-core `color-contrast` scan against the surface on an accessibility-gated theme; zero violations required. For a color-conveyed status, confirm an accompanying icon/text label independent of color, and recheck under a colorblind-vision emulation.
    violation_signal: A foreground/background pair below the 4.5:1/3:1 threshold; an axe `color-contrast` violation; a status relying on red/green alone with no icon or text.
    status: SUSPECT
    suspect_reason: "[case] MSNF-090 failed in REG-2026-10-01-1243"
  - id: BL-A11Y-004
    title: Programmatic status, state, and role correctness (axe-clean)
    rule: Every ARIA role/state/property a component sets MUST be valid, complete, and reflect the control's actual state (WCAG 4.1.2). A message appearing asynchronously in response to a user action MUST be exposed to assistive technology at the moment it appears — via `role="alert"`/`aria-live`, or an explicit focus shift plus `aria-describedby` linkage to the field it concerns — not by visual styling alone (WCAG 4.1.3; WCAG 3.3.1 for field-level errors). A surface MUST be free of axe-core Critical/Serious violations.
    priority: P1-data
    trust: DECLARED
    source:
      - kind: code
        ref: '`client-app/shared/cart/components/coupon-card.vue` — the coupon-apply error paragraph is conditionally mounted with `role="alert"` only when an error exists, so its appearance in the DOM itself triggers the assistive-technology alert announcement.'
      - kind: doc
        ref: "w3.org/TR/WCAG22#name-role-value (SC 4.1.2), #status-messages (SC 4.1.3), #error-identification (SC 3.3.1) — valid state, status messages exposed to AT, errors identified"
      - kind: resolution
        ref: VCST-5912 (Done) — quantity spinbutton exposed aria-invalid=true and a wrong aria-valuenow on untouched render; fixed
    check:
      kind: manual
      ref: Trigger the async state (invalid submit, coupon apply, menu/tab toggle) and confirm the resulting node carries `role="alert"`/a live region or receives focus, with a field-level error additionally carrying a matching `aria-describedby`. Run a full axe-core scan; zero Critical/Serious violations required.
    violation_signal: An error/status message with no `role="alert"`/`aria-live` and no focus shift; `aria-expanded`/`aria-selected` not toggling with visible state; an axe Critical or Serious violation.
    status: ACTIVE

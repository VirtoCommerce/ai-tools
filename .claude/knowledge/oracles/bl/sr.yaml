# yaml-language-server: $schema=../../../../templates/bl.schema.json
domain:
  heading: "Domain 20: Sales Rep (BL-SR)"
  prefixes:
    - BL-SR
  agents:
    - qa-backend-expert
    - qa-frontend-expert
  intro: "Scoped storefront GraphQL surface for sales representatives (`POST /graphql/sales-rep`) — the customers a rep serves, their orders, and dashboard/customer-profile **statistics** (order purchases, carts/projects, customer counters, top-selling products) with a server-owned filter+sort rule vocabulary. Grounded in `vc-module-sales-rep` (PR #4, epic VCST-5142; tickets VCST-5309/5362/5368/5485) README + live verification on vcst-qa (module `SalesRep_3.1000.0-pr-4`, TLC-2026-07-23-1943). Every query is authenticated and **creator + membership scoped**. Also covers the storefront hub-access gate (VCST-5494) and the embedded back-office Admin app's RBAC model (VCST-5293), audited separately on 2026-07-24 (TLC-2026-07-24-1906, BL-AUDIT-2026-07-24)."
rules:
  - id: BL-SR-001
    title: Statistics periods are inclusive UTC instants, no server truncation; omitted bounds → all-time
    rule: '`salesRepCustomerOrderStatistics` / `salesRepCustomerCartStatistics` accept any number of aliased `period(from, to)` and `comparison(current, previous)` blocks. Both bounds are **inclusive UTC instants** — the caller sends the time component and any local→UTC conversion; the server does **no** date truncation. A `period` with no bounds → all-time (`firstOrderDate` = "customer since"). A per-request loader coalesces identical ranges so a range used by both a period and a comparison is aggregated once.'
    priority: P1-data
    trust: INFERRED
    source:
      - kind: other
        ref: module README §Order statistics ("both `period` bounds are inclusive and compared as UTC instants… there is no server-side date truncation"); live probe 2026-07-23.
      - kind: doc
        ref: platform/developer-guide/docs/GraphQL-Storefront-API-Reference-xAPI/SalesRep/queries/salesRepCustomerOrderStatistics.md (published) — example uses aliased period/comparison blocks and a bound-less period returning firstOrderDate as 'customer since'
    scope:
      code_ref: vc-module-sales-rep:src/VirtoCommerce.SalesRep.Data/Services/Statistics/CustomerOrderStatisticsService.cs#BuildQuery
    check:
      kind: manual
      ref: Same range requested as an aliased `period` and inside a `comparison` → identical aggregate, one DB pass; a bounded `period` vs a no-bound `period` on the same customer → all-time count ≥ bounded count.
    violation_signal: Server re-truncates the caller's bounds to date boundaries; identical ranges aggregated more than once; omitted bounds error instead of all-time.
    status: ACTIVE
  - id: BL-SR-002
    title: Statistics are creator + membership scoped — no cross-rep / unserved-org leak
    rule: "**Two halves, and they have different scopes.** **(a) Membership scope — UNIVERSAL.** Every sales-rep surface is confined to the **organizations the rep serves**: a rep never sees another rep's data, an organization the rep does not serve yields no data (null / zero / empty) rather than a leak, and anonymous callers get an authorization error. **(b) Creator scope — the STATISTICS AND RANKINGS family ONLY.** `salesRepOrders`, the three statistics queries (`salesRepCustomerOrderStatistics` / `salesRepCustomerCartStatistics` / `salesRepCustomerCounts`), `salesRepTopSellers`, and the order-derived `salesRepCustomers` orderings additionally count **only the carts/orders the calling rep created**. **Half (b) does NOT extend to the index-backed \"every order of a served customer\" surface** (`salesRepCustomerOrders` / `salesRepCustomerOrder`), which is **deliberately creator-AGNOSTIC**: a rep sees orders placed by buyers and by colleagues within the orgs they serve. That is the surface working as designed, not a violation of this rule — judging that family against half (b) manufactures a false FAIL."
    priority: P0-security
    trust: DECLARED
    source:
      - kind: doc
        ref: "PlatformUserGuide → Sales Rep → Overview (Key features): *\"List and filter orders: Show the orders a rep created for their customers\"* — supports the creator-scope half for the rep's own order list (`salesRepOrders`). The guide is silent on the statistics/rankings creator-scope and never mentions `salesRepCustomerOrders`/`salesRepCustomerOrder` at all — that carve-out remains an undocumented implementation detail (bl-audit-criteria §1a class 1). No page states the membership-scope half (a) explicitly either; it is inferred from the per-organization assignment model the same guide describes."
      - kind: other
        ref: 'module README @`dev` — *"All statistics and rankings obey the same data-isolation rule … they count only the data the calling rep created (their own orders/carts), within the organizations they serve"* (L459), and *"Every statistics query is scoped two ways — to the organizations the rep serves (membership) and to the data the rep created"* (L489). The README does **not** mention `salesRepCustomerOrders` at all. Source: `SalesRepOrdersQueryHandler.BuildSearchCriteria` sets BOTH `criteria.OrganizationIds` and `criteria.CustomerId = request.UserId` (blob `8f7253d0`), whereas the customer-orders handler applies organization scope only. Live probe 2026-07-23; re-probed 2026-09-04.'
      - kind: doc
        ref: platform/developer-guide/docs/GraphQL-Storefront-API-Reference-xAPI/SalesRep/overview.md (published) — POST /graphql/sales-rep requires a bearer token and is scoped to the store and membership of the caller
      - kind: doc
        ref: platform/developer-guide/docs/GraphQL-Storefront-API-Reference-xAPI/SalesRep/queries/salesRepOrders.md (published) — returns the orders the sales representative created for their customers
    scope:
      code_ref: vc-module-sales-rep:src/VirtoCommerce.SalesRep.Data/Services/SalesRepOrganizationAccessService.cs#GetVisibleOrganizationIdsAsync
    check:
      kind: manual
      ref: "*Half (a):* `salesRepCustomer`/`salesRepCustomerOrderStatistics` for an unserved org resolves null/empty (mirrors 050m SR-GQL-016/023); a per-org **locked** membership excludes that org while unlocked orgs still resolve; anonymous → auth error. *Half (b) — the CONTRAST is the test, and it is literal-free:* on ONE rep token in ONE window, `salesRepOrders` returns strictly fewer orders than `salesRepCustomerOrders`, and `salesRepCustomerOrders` returns **more than one distinct `customerId`** (a creator-scoped surface returns exactly one). Rep A's **statistics** still exclude rep B's orders in a shared org."
    violation_signal: "*Half (a)* — any surface returns data from an org the rep does not serve, or anonymous access returns data. *Half (b)* — a **statistics or ranking** figure includes orders/carts the rep did not create. **NOT a violation:** `salesRepCustomerOrders` / `salesRepCustomerOrder` returning an order the rep did not place — that is the surface's purpose."
    status: SUSPECT
    suspect_reason: "[case] B2C-LIST-052, B2C-LIST-053, B2C-LIST-054, B2C-LIST-057, B2C-LIST-070, B2C-LIST-071, B2C-LIST-074, B2C-LIST-078, WISH-039, WISH-041, WISH-043, WISH-049 failed in REG-2026-10-05-1613"
  - id: BL-SR-003
    title: Comparison returns the delta; `*ChangePercent` is NULL when the previous baseline is 0
    rule: "`comparison(current, previous)` always returns the absolute change (`totalChange`, `countChange`, `averageChange` as Money/scalar) plus a `*ChangePercent`. When the **previous** period baseline is 0, the percent is **null** (no divide-by-zero, no Infinity) while the absolute change is still the full current value."
    priority: P1-data
    trust: INFERRED
    source:
      - kind: other
        ref: module README §Order statistics comparison; live probe 2026-07-23.
      - kind: doc
        ref: platform/developer-guide/docs/GraphQL-Storefront-API-Reference-xAPI/SalesRep/queries/salesRepCustomerOrderStatistics.md (published) — comparison(current, previous) returns totalChange, totalChangePercent, countChange, countChangePercent
    scope:
      code_ref: vc-module-sales-rep:src/VirtoCommerce.SalesRep.ExperienceApi/Schemas/StatisticsFieldHelper.cs#Percent
    check:
      kind: manual
      ref: "Customer with orders only in the current period, none in the previous → `totalChange.amount` = current total, `totalChangePercent` = null, `countChangePercent` = null. (Live-confirmed 2026-07-23: `totalChange.amount=816`, `totalChangePercent=null`.)"
    violation_signal: Percent renders as `Infinity`/`NaN`/`0` or errors when previous = 0; absolute change dropped when percent is null.
    status: ACTIVE
  - id: BL-SR-004
    title: Money resolves to one currency (`currencyCode` → store default → platform primary) and echoes it
    rule: All monetary statistics are converted to a single currency chosen by `currencyCode`, falling back to the store default then the platform primary; the resolved `currencyCode` is echoed back and `formattedAmount` is localized by `cultureName`. Mixed-currency underlying orders are aggregated into that one currency.
    priority: P1-data
    trust: INFERRED
    source:
      - kind: other
        ref: module README (Money "converted to `currencyCode` → store default → platform primary"); live probe 2026-07-23.
      - kind: doc
        ref: platform/developer-guide/docs/GraphQL-Storefront-API-Reference-xAPI/SalesRep/queries/salesRepCustomerOrderStatistics.md (published) — currencyCode argument is the reporting currency; response example echoes currencyCode with localized formattedAmount
    scope:
      code_ref: vc-module-sales-rep:src/VirtoCommerce.SalesRep.ExperienceApi/Services/SalesRepCurrencyResolver.cs#ResolveCurrencyCodeAsync
    check:
      kind: manual
      ref: 'Pass `currencyCode:"EUR"` → response `currencyCode:"EUR"`, `formattedAmount` uses the € symbol; omit → store default. (Live-confirmed 2026-07-23: EUR echoed, `€816.00`.) Assert the echoed code + symbol, **not** a specific converted amount (FX rate is env-dependent — vcst-qa EUR ≈ 1.0).'
    violation_signal: "`currencyCode` not echoed; `formattedAmount` unlocalized; per-currency figures returned unconverted / double-counted."
    status: ACTIVE
  - id: BL-SR-005
    title: Statistics scope excludes flag-cancelled / prototype orders unconditionally
    rule: The statistics scope (`salesRepCustomerOrderStatistics` / `salesRepCustomerCartStatistics`) excludes orders and carts flagged prototype or cancelled **at the entity level** (`IsPrototype` / `IsCancelled`) — unconditionally, and this does NOT loosen under any named filter. This differs from the order-*list* scope, which deliberately includes cancelled orders so that `Cancelled` is a real list filter (BL-SR-009). An order whose `Status` field merely reads a cancelled-like value **without** the `IsCancelled` flag (e.g. written directly by an external/ERP integration bypassing the platform cancel workflow) is NOT excluded by this scope and correctly counts toward every statistics figure, including the baseline/all-status one.
    priority: P1-data
    trust: INFERRED
    source:
      - kind: code
        ref: "vc-module-sales-rep `RepOrderScopeQueryExtensions.ApplyRepScope` (default `includeCancelled=false` → filters `!IsPrototype && !IsCancelled`); `CustomerOrderStatisticsService.BuildQuery` calls it with no `includeCancelled` argument, so the exclusion is unconditional regardless of any status filter. Contrast `SalesRepOrderStatusService.BuildQuery`, which passes `includeCancelled: true` for the list scope (BL-SR-009)."
    scope:
      code_ref: vc-module-sales-rep:src/VirtoCommerce.SalesRep.Data/Services/Statistics/RepOrderScopeQueryExtensions.cs#ApplyRepScope
    check:
      kind: manual
      ref: A customer with a genuinely cancelled order (`IsCancelled=true`) → every statistics figure excludes it under any filter, including `filter:"Cancelled"`. A customer with a `Status`-only cancelled-looking order (`IsCancelled=false`) → the baseline/all-status figure INCLUDES it.
    violation_signal: Flag-cancelled/prototype orders inflate the baseline totals/counts; OR a flag-less, status-only cancelled-looking order is wrongly excluded from the baseline (scope matching on the `Status` string instead of the `IsCancelled`/`IsPrototype` flags).
    status: ACTIVE
  - id: BL-SR-006
    title: Cart statistics are currency-scoped; item quantity is the shipped primary metric
    rule: "`salesRepCustomerCartStatistics` uses a cart-*kind* filter whose built-in default `\"active-carts\"` = non-empty carts that are **not** wishlists. `count` / `total` / `average` remain schema fields, but the shipped Active-carts widget surfaces **summed line-item quantity** (selected vs not-selected-for-checkout) as its primary figures, with `count` demoted to an internal denominator for `average`. Cart statistics are scoped to **exactly the requested `currencyCode`** — a customer's carts in other currencies are excluded outright, never folded or converted (unlike order-statistics Money, BL-SR-004). Gift line items are included in the item-quantity figures but excluded from the money total/count and from the storefront's own cart-page counter — a known, currently-unresolved inconsistency. Same `period`/`comparison` shape as order statistics; same creator+membership scope (BL-SR-002)."
    priority: P1-data
    trust: DECLARED
    source:
      - kind: code
        ref: vc-module-sales-rep `CustomerCartStatisticsService.BuildQuery` — `query.Where(x.Currency == currencyCode)` ("One cart per currency, mirrored on a switch, so folding every currency would report one cart as many"); `AddCartFiguresAsync` excludes `IsGift` from total/count while `AddItemQuantitiesAsync` does not.
      - kind: ac
        ref: "VCST-5588 (Done) — agreed redesign: Active carts shows summed quantities of lines selected / not selected for checkout; wishlist and saved-for-later excluded"
      - kind: resolution
        ref: VCST-5588 (Done) — QA reopen found carts of other currencies summed; fix filters Active cart data by currency; gifts stated to count as cart items
      - kind: resolution
        ref: VCST-5648 (Cancelled) — dev confirms non-empty guard applies to dated windows as well; empty carts never counted as active
      - kind: doc
        ref: platform/developer-guide/docs/GraphQL-Storefront-API-Reference-xAPI/SalesRep/queries/salesRepCartFilterRules.md (published) — cart statistics filter rule 'active-carts' discovered with a localizedName
    scope:
      code_ref: vc-module-sales-rep:src/VirtoCommerce.SalesRep.Data/Services/Statistics/CustomerCartStatisticsService.cs#BuildQuery
    check:
      kind: manual
      ref: Rep with active carts across served orgs → the `active-carts` period returns selected/unselected item quantities. A customer's carts in a currency other than the requested `currencyCode` contribute nothing to the figures (not converted, not merged).
    violation_signal: Wishlists or empty carts counted as active; carts in another currency folded into the requested-currency figures; another rep's carts included.
    status: ACTIVE
  - id: BL-SR-007
    title: Customer counts — `assignedCustomers` is a period-independent scalar; period counts never exceed it
    rule: "`salesRepCustomerCounts` exposes `assignedCustomers` (a scalar total of served orgs, period-independent) plus `period{orderingCustomers, newCustomers}` and `comparison{orderingCustomersChange, orderingCustomersChangePercent, newCustomersChange}`. `orderingCustomers` and `newCustomers` for any period are ≤ `assignedCustomers`."
    priority: P1-data
    trust: DECLARED
    source:
      - kind: other
        ref: module README §My customers; live probe 2026-07-23.
      - kind: doc
        ref: platform/developer-guide/docs/GraphQL-Storefront-API-Reference-xAPI/SalesRep/queries/salesRepCustomerCounts.md (published) — returns how many customers the rep is assigned plus ordering/new customers over requested date ranges, scoped to the rep
    scope:
      code_ref: vc-module-sales-rep:src/VirtoCommerce.SalesRep.ExperienceApi/Schemas/SalesRepCustomerCountsType.cs#SalesRepCustomerCountsType
    check:
      kind: manual
      ref: "Rep serving 5 orgs → `assignedCustomers=5`; a month's `orderingCustomers`/`newCustomers` ≤ 5. (Live-confirmed 2026-07-23: 5 / 4 / 5.)"
    violation_signal: A period count exceeds `assignedCustomers`; `assignedCustomers` varies with the period arg.
    status: ACTIVE
  - id: BL-SR-008
    title: Top sellers ranked by named sort over a period; `take` clamps at 10 (never errors); rows are a line-item snapshot
    rule: "`salesRepTopSellers` ranks products by `sort` (`by-units` default, `by-revenue`) over an optional `period`, returning the top `take` (default 5, **max 10**). `take` above 10 is **clamped** (never a validation error). Each row's `name`/`sku`/`imageUrl`/category come from the **order line-item snapshot** — no live catalog read; `revenue` is Money. Optional category `filter` restricts to that category's subtree. Creator+membership scoped (BL-SR-002); omit `organizationId` for the cross-customer dashboard."
    priority: P1-data
    trust: DECLARED
    source:
      - kind: other
        ref: module README §Top sellers; live probe 2026-07-23.
      - kind: doc
        ref: platform/developer-guide/docs/GraphQL-Storefront-API-Reference-xAPI/SalesRep/queries/salesRepTopSellers.md (published) — ranks best sellers by units (default) or revenue over a period; omit organizationId for cross-customer; filter restricts to category subtree
    scope:
      code_ref: vc-module-sales-rep:src/VirtoCommerce.SalesRep.ExperienceApi/Queries/SalesRepTopSellersQueryHandler.cs#Handle
    check:
      kind: manual
      ref: "`take:5` → ≤5 rows; `take:15` → ≤10 rows, no error (live-confirmed 2026-07-23: clamped); `by-units` vs `by-revenue` re-rank; category filter narrows the set; row identity from snapshot even if the catalog product changed."
    violation_signal: "`take>10` errors or returns >10; ranking reads live catalog; category filter ignored; another rep's line items ranked."
    status: ACTIVE
  - id: BL-SR-009
    title: One named filter rule per axis; omit → baseline; unknown name fails CLOSED (no data, no error)
    rule: "Lists and statistics blocks are filtered by a single **named filter rule** (not raw statuses), discovered per axis via `salesRepOrderFilterRules` / `salesRepCartFilterRules` / `salesRepCustomerFilterRules` / `salesRepTopSellerFilterRules` (`{name, localizedName}`). Omit `filter` → baseline; an **unrecognized name fails CLOSED** (returns zero data, never \"return everything\"), no error. Rule sets are overridable per project; a rule may be composite. `salesRepCustomerFilterRules` ships a single `All` baseline; `salesRepTopSellerFilterRules` names are category ids. **This invariant governs exactly those four axes and does not extend to the index-backed \"every order of a served customer\" surface** (`salesRepCustomerOrders`): its `filter` argument is a raw search-phrase / field:value expression in the order-search index's own grammar, not a named-rule lookup — it ships no filter-rule discovery query, and it correctly **narrows** on a raw field:value term rather than failing closed on it. That is the surface working as designed, not a violation of this rule."
    priority: P1-data
    trust: INFERRED
    source:
      - kind: other
        ref: "module README §Filter rules + its new §Customer orders (\"Unlike the rule-based lists above, these two follow **X-Order's** shape: `filter` is a search phrase, `facet` names index fields, and `sort` takes index field expressions. They read the order **index**, not the database\"); `SalesRepOrdersQueryHandler.Handle` resolves via `_filterRuleResolver.ApplyListFilterAsync(...)`, whereas `SalesRepCustomerOrdersQueryHandler.BuildSearchCriteria` assigns `criteria.Keyword = request.Filter` with no rule-resolver call and no discovery-query type in existence for it; live probe 2026-07-23; re-triangulated 2026-09-03."
      - kind: doc
        ref: platform/developer-guide/docs/GraphQL-Storefront-API-Reference-xAPI/SalesRep/queries/salesRepOrderFilterRules.md (published) — named filters for orders list and order statistics, each with name and localizedName
      - kind: doc
        ref: platform/developer-guide/docs/GraphQL-Storefront-API-Reference-xAPI/SalesRep/queries/salesRepCustomerFilterRules.md (published) — customer filter rules ship a single 'all' rule
    scope:
      code_ref: vc-module-sales-rep:src/VirtoCommerce.SalesRep.ExperienceApi/Services/SalesRepOrderFilterRuleResolver.cs#ApplyListFilterAsync
    check:
      kind: manual
      ref: "`filter:\"BOGUS\"` on `salesRepOrders` → `totalCount:0` while baseline (no filter) > 0 (live-confirmed 2026-07-23: 0 vs 8); discovery returns localized names. **Contrast:** the identical raw field:value term *narrows* `salesRepCustomerOrders` instead of failing closed, and no filter-rule discovery query exists for that surface (querying one is a schema error) — both are correct under this Rule's stated scope. Re-confirmed by paired probes in one window on the same token."
    violation_signal: "Unknown filter returns the full/baseline set (fails open); a raw status/type accepted instead of a rule name; discovery returns raw enum keys — **on one of the four named axes.** NOT a violation of this rule: a raw field:value filter narrowing `salesRepCustomerOrders`, or the absence of a filter-rule discovery query on that surface."
    status: ACTIVE
    verified:
      date: 2026-10-07
      by: REG-2026-10-07-1421
  - id: BL-SR-010
    title: One named sort rule per axis; unknown name → default ordering; unsupported direction → ERROR; `customerSalesReps` exempt
    rule: 'Lists are ordered by a single **named sort rule** discovered via `salesRepOrderSortRules` (`recent` default, `total`) / `salesRepCustomerSortRules` (`my-last-orders` default, `ytd-purchases`, `name`) / `salesRepTopSellerSortRules` (`by-units` default, `by-revenue`). A sort **never fails closed on the name** — an unknown/omitted rule name falls back to the domain default (no error). An optional `:asc`/`:desc` direction suffix reverses a rule **where meaningful** (`total:asc`, `name:desc`, `ytd-purchases:asc`); an **unsupported direction is rejected with an error** (`recent:asc`, `by-units:asc` → `extensions.code=ARGUMENT`). `customerSalesReps` accepts a plain member `sort` (e.g. `name:asc`) but is **exempt from the named rep sort-rule vocabulary** (no discovery query). The customers-list direction applies uniformly to member-column and order-derived (`my-last-orders`/`ytd-purchases`) rankings. **This invariant governs exactly those three axes (plus the stated `customerSalesReps` exemption) and does not extend to the index-backed "every order of a served customer" surface** (`salesRepCustomerOrders`): its `sort` takes a raw X-Order **field expression** (`<indexField>:asc|desc`), ships no sort-rule discovery query, performs **no direction validation** — an unsupported direction is accepted silently rather than rejected — and an unrecognized token does **NOT** fall back to the domain default but yields a third, undefined ordering. All of that is that surface working as designed, not a violation of this rule.'
    priority: P1-data
    trust: INFERRED
    source:
      - kind: other
        ref: module README §Sort rules, which scopes itself in its own opening words — "The **orders, customers and top-sellers** lists are ordered by a single, optional named sort rule" — plus its §Customer orders ("Unlike the rule-based lists above, these two follow **X-Order's** shape … `sort` takes index field expressions"); `SalesRepOrdersQueryHandler` resolves via `_sortRuleResolver.ApplySortAsync(...)`, whereas `SalesRepCustomerOrdersQueryHandler.BuildSearchCriteria` assigns `criteria.Sort = request.Sort.EmptyToNull() ?? DefaultSort` with no resolver call and no discovery-query type in existence for it; live probe 2026-07-23; re-triangulated 2026-09-03.
      - kind: doc
        ref: platform/developer-guide/docs/GraphQL-Storefront-API-Reference-xAPI/SalesRep/queries/salesRepTopSellerSortRules.md (published) — ranking options by-units and by-revenue discovered with localizedName
    scope:
      code_ref: vc-module-sales-rep:src/VirtoCommerce.SalesRep.ExperienceApi/Sorts/SortRuleResolverBase.cs#ResolveSortRuleAsync
    check:
      kind: manual
      ref: "Unknown sort name → default order, no error (live 2026-07-23: `totalCount` unchanged); `recent:asc`/`by-units:asc` → error `code=ARGUMENT`; `total:asc`/`name:desc`/`ytd-purchases:asc` → 200, reversed order; `customerSalesReps(sort:\"name:asc\")` → 200 (accepts plain sort). **Contrast, paired controls in one window:** a raw index-field expression *reorders* `salesRepCustomerOrders` while the same expression is *ignored* by `salesRepOrders` (which resolves names only); a legacy rule name sent to `salesRepCustomerOrders` produces neither that rule's ordering nor the default; and an unsupported direction that returns `code=ARGUMENT` on `salesRepOrders` returns 200 unchanged on `salesRepCustomerOrders`. No sort-rule discovery query exists for that surface."
    violation_signal: "Unknown sort name errors or fails closed; an unsupported direction silently ignored; `customerSalesReps` rejects a plain `sort` arg, or honors a named rep sort-rule token — **on one of the three named axes.** NOT a violation of this rule: `salesRepCustomerOrders` silently accepting an unsupported direction, honouring a raw index-field expression, not falling back to the default on an unknown token, or having no sort-rule discovery query. Read unscoped, the \"unsupported direction silently ignored\" clause condemns that surface's correct behaviour verbatim."
    status: ACTIVE
  - id: BL-SR-011
    title: Sales-rep storefront UI requires permission + module enabled; org membership is gated per-route, not uniformly
    rule: "The storefront Sales Rep area is gated on `sales-rep:access` AND the store's `SalesRep.Enabled` setting — both required for any Sales Rep surface to appear: a non-rep buyer is gated/redirected and no `salesRep*` widget or query fires, and with the module disabled the \"Sales Rep hub\" rail section and routes are absent even for a permissioned rep. **Org membership is NOT a uniform third requirement:** the **rep-facing** hub pages (`/company/dashboard`, `/company/my-customers`, `/company/my-customers/{orgId}`) are reachable regardless of the rep's own organization membership — a rep's customers are the organizations they *serve*, independent of any org the rep belongs to (fix `VCST-5494`, vc-frontend PR #2391, clears the inherited `meta.requiresOrganization` on the three rep-facing routes). Only the **buyer-facing** `/company/sales-reps` contact page still requires org membership."
    priority: P0-security
    trust: DECLARED
    source:
      - kind: code
        ref: 'module README ("Toggle the storefront Sales Rep UI per store"); live verification 2026-07-23 (hub route `/company/dashboard`); vc-frontend PR #2391 `fix(VCST-5494)` (merged dev 2026-07-23) narrows the org-membership requirement to the buyer-facing route only.'
      - kind: doc
        ref: platform/user-guide/docs/sales-rep/enabling-sales-rep.md (published) — Sales Rep app is enabled per store via the store's Sales rep module settings toggle
      - kind: doc
        ref: platform/user-guide/docs/sales-rep/managing-sales-reps.md (published) — 'Sales representative' role provides access to the sales rep hub on the frontend
      - kind: ac
        ref: VCST-5304 (Done) — when logged in as a Sales Rep (role), the account left rail gets a separate 'Sales Rep hub' widget
      - kind: resolution
        ref: VCST-5494 (Done) — rep with no org membership was redirected from My customers; fixed so rep-facing hub pages are reachable
    scope:
      code_ref: vc-frontend:client-app/modules/sales-rep/routes.ts#guardSalesRep
    check:
      kind: manual
      ref: Rep with `sales-rep:access` + module enabled → hub/my-customers/customer-profile render, including the empty "No customers found" state for a rep with **zero** org memberships; **any non-rep account lacking `sales-rep:access`** — a low-privilege buyer, **or a privileged non-rep** (e.g. an org maintainer holding org user-CRUD permissions and `platform:security:loginOnBehalf`, but not `sales-rep:access`) — is redirected, no `salesRep*` query issued; `SalesRep.Enabled=false` → hub/list/profile unreachable and rail section absent (mirrors 089 SR-FE-003). The buyer-facing `/company/sales-reps` page stays org-gated regardless.
    violation_signal: Any sales-rep widget/query for a non-rep; hub reachable while the module is disabled (client-side-only gate); OR a customer-less rep's rep-facing hub links render but **redirect to `/account/dashboard`** (visible-but-dead links — the pre-fix VCST-5494 behavior).
    status: ACTIVE
    verified:
      date: 2026-10-07
      by: REG-2026-10-07-1421
  - id: BL-SR-012
    title: Filter-aware empty states distinguish "no data" from "nothing matched the filter/search"
    rule: The orders, top-sellers and my-customers views render **distinct** empty states for "the rep has no data at all" vs "the current filter/search matched nothing" — the latter must offer a way back (clear filter/search), not read as "you have no customers/orders".
    priority: P2-ux
    trust: INFERRED
    source:
      - kind: code

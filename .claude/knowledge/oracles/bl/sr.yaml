  - id: BL-SR-014
    title: Embedded Sales Rep Admin app gates on customer-member + platform-security permissions, not on `sales-rep:access`
    rule: |-
      The embedded Sales Rep Admin app (`api/sales-rep`) is gated by the **customer module's member permissions + platform security permissions**, NOT by `sales-rep:access` (which only defines a storefront rep) and NOT merely by the module being installed. The exact matrix (`[Authorize]` attributes; **multiple attributes = AND — all required**):
        - **Read** (`search`, `roles`, `dictionaries`, `GET {id}`) → **`customer:read`**.
        - **Create** → **`customer:create` AND `platform:security:create`**.
        - **Update** → **`customer:update` AND `platform:security:update`**.
        - **Delete** → **`customer:delete` AND `platform:security:delete`**.
        - **Account-only ops** (`{id}/block`, `{id}/unblock`, `{id}/password`) → **`platform:security:update` only** (NOT `customer:update`) — a distinct mutate class from entity CRUD.
        - An `isAdministrator` account bypasses all checks.
    priority: P1-data
    trust: INFERRED
    source:
      - kind: code
        ref: "`vc-module-sales-rep` `SalesRepController.cs` (`dev`, `api/sales-rep`) — per-endpoint `[Authorize]` map (`CustomerModule…Permissions.Read/Create/Update/Delete` + `Platform…Permissions.SecurityCreate/Update/Delete`); `useSalesRepPermissions/index.ts` (frontend UI gate — CRUD subset, no account-ops class); `ModuleConstants.cs` (`sales-rep:access` = rep definition only). VCST-5293."
      - kind: doc
        ref: platform/user-guide/docs/sales-rep/managing-sales-reps.md (published) — admins view, add, edit, block and delete sales reps; no permission requirements stated
    scope:
      code_ref: vc-module-sales-rep:src/VirtoCommerce.SalesRep.Web/Controllers/Api/SalesRepController.cs#SalesRepController
    check:
      kind: manual
      ref: a back-office Manager (`isAdministrator=false`) **without `customer:read`** gets the menu entry hidden and `POST /api/sales-rep/search` → 302 → AccessDenied; a Manager with **`customer:read` only** opens the app and lists reps (search → 200) but Add/Delete/Save are hidden and `POST`/`PUT /api/sales-rep` → **403**; block/unblock/reset-password succeed only with `platform:security:update` (independent of `customer:update`).
    violation_signal: a Manager lacking `customer:read` reaches the rep list; a `customer:read`-only Manager creates/edits/deletes a rep (UI action present or create/update API 2xx); or block/unblock/set-password succeeds without `platform:security:update`.
    status: ACTIVE

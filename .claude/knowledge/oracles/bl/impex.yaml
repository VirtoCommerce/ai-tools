# yaml-language-server: $schema=../../../../templates/bl.schema.json
domain:
  heading: "Domain 12: Import / Export (BL-IMPEX)"
  prefixes:
    - BL-IMPEX
  agents:
    - qa-backend-expert
rules:
  - id: BL-IMPEX-001
    title: CSV import is idempotent
    rule: Re-importing the same CSV file must update existing records (matched by ID or code), not create duplicates. The import uses a unique identifier (product code, SKU, or explicit ID column) for matching. If the identifier is missing or ambiguous, the import must fail with a clear error — not silently create duplicates.
    priority: P1-data
    trust: DECLARED
    source:
      - kind: doc
        ref: platform/user-guide/docs/catalog/import-products-to-catalog.md (docs) — CSV must carry Id or SKU; a match updates the existing product, only unmatched rows create new ones
      - kind: resolution
        ref: VP-2258 (Done) — CSV re-import created duplicate parent categories; fixed so re-import updates in the correct category path
    check:
      kind: manual
      ref: Import CSV with 50 products → 50 products created. Re-import same CSV → still 50 products (updated, not 100). Modify one row → re-import → only that product updated, others unchanged.
    violation_signal: Re-import doubles the record count; duplicate products with same code; import succeeds without unique identifier; modified records not updated on re-import.
    status: ACTIVE
  - id: BL-IMPEX-002
    title: Export matches admin grid filters
    rule: When exporting data from Admin (products, orders, customers), the exported file must contain exactly the records matching the current grid filter/search. Exporting without a filter exports all records. The export format (CSV columns, date format, encoding) must be consistent and documented. Export must handle large datasets without timeout — catalog CSV export always runs as a Hangfire background job (regardless of record count), returning an `ExportNotification` for progress and a blob download URL on completion.
    priority: P1-data
    trust: INFERRED
    source:
      - kind: doc
        ref: platform/user-guide/docs/catalog-csv-export-import/export-catalog.md (docs) — export the selected categories/products via toolbar Export, then download the generated CSV after completion
    check:
      kind: manual
      ref: Filter products by category X (showing 30) → export → CSV contains exactly 30 rows. Clear filter → export → CSV contains all products. Check CSV encoding (UTF-8 BOM for Excel compatibility).
    violation_signal: Export includes records outside current filter; export count doesn't match grid count; large export times out with no error; encoding issues (garbled characters).
    status: ACTIVE
  - id: BL-IMPEX-003
    title: Large import does not timeout silently
    rule: CSV catalog imports always run as a Hangfire background job (regardless of row count); the import API returns immediately with an `ImportNotification` for progress reporting via push notifications. The user must see a progress indicator or notification when the job completes. If the import fails mid-way (e.g., row 500 of 1000 has invalid data), already-processed rows must be committed (partial success), and the error must be reported with the failing row number and reason.
    priority: P1-data
    trust: INFERRED
    source: []
    check:
      kind: manual
      ref: 'Import 2000-row CSV → job starts in background → progress visible → completion notification. Import CSV with bad row 500 → rows 1-499 imported → error report shows "Row 500: invalid price format" → rows 501+ skipped or continued (based on config).'
    violation_signal: Large import runs synchronously (browser hangs); silent timeout with no error; no progress indication; partial failure rolls back all rows; error message doesn't identify failing row.
    status: ACTIVE
  - id: BL-IMPEX-004
    title: Import validates data integrity before commit
    rule: Import must validate data types, required fields, foreign key references (e.g., category exists, currency valid), and business rules (e.g., price > 0) before committing. Validation errors must be collected and reported as a batch — not one-at-a-time. A "dry run" or validation-only mode should be available for large imports.
    priority: P1-data
    trust: INFERRED
    source: []
    check:
      kind: manual
      ref: "Import CSV with: missing required field → error \"Row 3: Name is required.\" Invalid category reference → error \"Row 7: Category 'XYZ' not found.\" Negative price → error \"Row 12: Price must be > 0.\" All errors reported in one batch."
    violation_signal: Invalid data imported without error; errors reported one at a time (requiring multiple re-imports); foreign key violations cause 500 error instead of validation message; no dry-run option.
    status: ACTIVE

# yaml-language-server: $schema=../../../../templates/bl.schema.json
domain:
  heading: "Domain 4: Orders & Fulfillment (BL-ORD)"
  prefixes:
    - BL-ORD
  agents:
    - qa-backend-expert
    - qa-testing-expert
    - qa-frontend-expert
rules:
  - id: BL-ORD-001
    title: Order state machine guards
    rule: |-
      Payment and shipment follow strict state machines with guards:
        - **Payment:** `Pending → Authorized → Paid → Refunded`, with `Authorized → Voided` as a separate pre-capture branch. The capture operation sets `PaymentStatus = Paid` — there is **no `Captured` enum value**. Cannot capture without authorization. Cannot refund without capture (refund requires `Paid`). Void is only possible before capture (from `Authorized`, never from `Paid`). See BL-ORD-006 for the detailed transition table.
        - **Shipment:** `New → Pick & Pack → Ready to Send → Send`. Cannot mark "Send" before "Pick & Pack". No "Delivered" sub-state — delivered semantics live at ORDER level (`OrderStatus = Completed`). See BL-ORD-007.
    priority: P0-revenue
    trust: INFERRED
    source:
      - kind: code
        ref: vc-module-order `PaymentFlowService.cs` — `CaptureAllowedPaymentStatuses => [Authorized, Paid]`, `RefundAllowedPaymentStatuses => [Paid, PartiallyRefunded, Refunded]` (Voided excluded); shipment status enum = New / Pick & Pack / Ready to Send / Send (no "Delivered").
      - kind: doc
        ref: platform/user-guide/docs/order-management/managing-documents.md (published) — refunds can be issued for payments/orders with Paid status; capture is an action on the PaymentIn document.
    check:
      kind: manual
      ref: In Admin → Order → attempt to skip states (e.g., capture without authorization) → should fail or button should be absent. Verify API rejects invalid state transitions.
    violation_signal: Payment captured without prior authorization; shipment marked "Send" while still "New"; state skipped without error.
    status: ACTIVE
    history: docs/decisions/bl/ord.md#bl-ord-001
  - id: BL-ORD-002
    title: Cancellation restores inventory conditionally
    rule: When an order is cancelled, inventory is restored ONLY if the "Adjust inventory on order cancellation" flag is enabled in store settings. Without the flag, cancellation does NOT restore stock — manual inventory adjustment required.
    priority: P1-data
    trust: INFERRED
    source: []
    check:
      kind: manual
      ref: Enable flag → cancel order → check FFC inventory (should increase). Disable flag → cancel order → inventory unchanged.
    violation_signal: Inventory restored when flag is OFF; inventory NOT restored when flag is ON; stock count mismatch after cancellation.
    status: ACTIVE
    history: docs/decisions/bl/ord.md#bl-ord-002
  - id: BL-ORD-003
    title: Partial fulfillment rules
    rule: An order with multiple line items can be partially fulfilled — some items shipped while others remain pending. Each shipment tracks its own items and state independently (`New → Pick & Pack → Ready to Send → Send`, per BL-ORD-007). Virto does **NOT** auto-assign a "Partially shipped" order status — that value is not in the platform status vocabulary (BL-ORD-009). Partial-fulfillment progress is observed via per-shipment statuses; order-level completion is set at ORDER level as `OrderStatus = Completed` (a settable status), never derived from an aggregate "all shipments Delivered" (there is no `Delivered` shipment state — BL-ORD-007).
    priority: P1-data
    trust: INFERRED
    source:
      - kind: doc
        ref: platform/user-guide/docs/order-management/managing-documents.md (published) — orders can carry several shipment documents, all listed in the Shipment widget.
    check:
      kind: manual
      ref: Order with 3 items → create 2 shipments (items A+B in shipment 1, item C in shipment 2) → advance shipment 1 to `Send` → shipment 1 shows `Send`, shipment 2 still `New` (per-shipment states independent) → advance shipment 2 to `Send` → set the order's `OrderStatus = Completed`. Assert there is no "Partially shipped" order status and no "Delivered" shipment state.
    violation_signal: Order marked "Completed" while shipments are pending; partial shipment not reflected in order status; items missing from shipment tracking.
    status: ACTIVE
    history: docs/decisions/bl/ord.md#bl-ord-003
  - id: BL-ORD-004
    title: Refund conditions
    rule: Refund is only possible on a payment that has been captured. Partial refund amount must be ≤ captured amount minus any previous refunds. Full refund sets payment status to "Refunded." A voided payment cannot be refunded. Refund does not automatically restore inventory — that follows BL-ORD-002 cancellation rules separately.
    priority: P0-revenue
    trust: DECLARED
    source:
      - kind: doc
        ref: platform/user-guide/docs/order-management/managing-documents.md (published) — refunds can be issued for Paid payments, full or partial, with amount, message and reason.
    check:
      kind: manual
      ref: Attempt refund on "Authorized" (not captured) payment → rejected. Capture $100 → refund $30 → remaining refundable = $70. Refund another $80 → rejected (exceeds remaining). Void a payment → refund button absent.
    violation_signal: Refund allowed on uncaptured payment; partial refund exceeds captured amount; refund succeeds on voided payment; inventory auto-restored on refund without cancellation.
    status: ACTIVE
    history: docs/decisions/bl/ord.md#bl-ord-004
  - id: BL-ORD-005
    title: Order number format and uniqueness
    rule: Every order receives a unique order number upon creation from the store-configurable `Order.CustomerOrderNewNumberTemplate` (default format `CO{date:yyMMdd}-{counter:D5}`, counter reset type `Daily` by default — configurable to `None`/`Weekly`/`Monthly`/`Yearly`). Because the counter resets each period, sequential numbering is only guaranteed **within the active reset period**, not globally — uniqueness across periods comes from the date component, not the counter alone. Order numbers must never be reused within the same reset period, even after cancellation. The order number is immutable after creation.
    priority: P1-data
    trust: DECLARED
    source:
      - kind: code
        ref: vc-module-core `CounterOptions.cs` — default `ResetCounterType.Daily`; `SequenceNumberGeneratorService.ShouldResetCounter` resets the sequence at the UTC day boundary.
      - kind: resolution
        ref: VP-8617 (Done) — fixed duplicate order numbers generated across users and stores; expected each order number to be unique.
      - kind: doc
        ref: platform/user-guide/docs/order-management/settings.md (published) — order number/template settings are managed per store.
    check:
      kind: manual
      ref: Place 3 orders on the same day → numbers share the day's date prefix and increment sequentially (e.g. `CO<date>-00001`, `-00002`, `-00003`). Cancel the middle order → place another same-day order → the next number continues the same-day sequence (not reused). Placing an order on a new day resets the counter to `00001` under the new date prefix — expected, not a bug.
    violation_signal: Duplicate order numbers *within the same reset period*; counter fails to reset at the configured boundary; order number changes after creation.
    status: ACTIVE
    history: docs/decisions/bl/ord.md#bl-ord-005
  - id: BL-ORD-006
    title: Payment state machine (detailed)
    rule: |-
      Payment states and allowed transitions:
        - `Pending` → `Authorized` (gateway authorization successful)
        - `Authorized` → `Paid` (funds captured/settled; the capture operation sets status to `Paid` — there is **no `Captured` enum value**)
        - `Authorized` → `Voided` (authorization cancelled before capture)
        - `Paid` → `Refunded` (full refund processed)
        - `Paid` → `PartiallyRefunded` (partial refund, remainder still captured)
        - Illegal: `Pending → Paid` (skipping auth), `Voided → Paid`, `Refunded → Paid`
    priority: P0-revenue
    trust: INFERRED
    source:
      - kind: doc
        ref: platform/user-guide/docs/order-management/managing-documents.md (published) — refunds are issued from Paid payments; capture is performed from the PaymentIn widget.
      - kind: resolution
        ref: VP-2355 (Done) — fixed a paid gateway payment staying Paid after order cancellation; expected status Refunded.
    check:
      kind: manual
      ref: For each illegal transition, attempt via API → expect 400/422 error. In Admin, verify buttons only show valid next states.
    violation_signal: Any illegal transition succeeds; Admin shows buttons for invalid states; API returns 200 on illegal transition.
    status: ACTIVE
    history: docs/decisions/bl/ord.md#bl-ord-006
  - id: BL-ORD-007
    title: Shipment state machine (detailed)
    rule: |-
      Live admin Shipment Status dropdown exposes 5 values (verified 2026-04-22 on the environment):
        - `New` → `Pick & Pack` (items being prepared)
        - `Pick & Pack` → `Ready to Send`
        - `Ready to Send` → `Send` (shipped with tracking number — note admin spelling is "Send" not "Sent")
        - `Any state` → `Cancelled`
      - **No "Delivered" shipment sub-state.** Delivered/fulfilled semantics are represented at the ORDER level via `OrderStatus = Completed`, not at the shipment level.
      - Illegal: `New → Send` (skipping Pick & Pack and Ready to Send); reversing transitions.
    priority: P1-data
    trust: INFERRED
    source: []
    check:
      kind: manual
      ref: For each illegal transition, attempt via API → expect error. In Admin, verify available actions match current state. Tracking number required for `Send` transition.
    violation_signal: State skipped; shipment marked `Send` without tracking number; API allows illegal jump.
    status: ACTIVE
    history: docs/decisions/bl/ord.md#bl-ord-007
  - id: BL-ORD-009
    title: Order status vocabulary
    rule: |-
      The order status vocabulary is an **admin-editable, localizable dictionary** (`Order.Status` setting, `IsDictionary = true`, `IsLocalizable = true`) — **not** a fixed enum. Every value in the dictionary is **settable** via the Admin Order → Status dropdown (the dropdown is populated from the dictionary), and a deployment may add, rename, or remove values. The platform ships a default seed of settable values — `New`, `Not payed`, `Pending`, `Processing`, `Ready to send`, `Cancelled`, `Partially sent`, `Completed` — which deployments commonly customize (e.g. `Payment required`, `Ready for pickup`, `Custom`). The exact list and count are therefore environment-configurable; the invariant is the dictionary mechanism, not a fixed set or count.
      - **`Processing` is a normal settable dictionary value — NOT read-only/computed.** It is one of the seeded `Order.Status` values and is selectable from the Status dropdown. It also serves as the default `Order.InitialProcessingStatus` (the status auto-assigned when order processing begins — mirroring `Order.InitialStatus`, default `New`, at creation), but auto-assignment does not make it read-only: an admin can set it manually and it persists.
    priority: P1-data
    trust: DECLARED
    source:
      - kind: code
        ref: 'vc-module-order `ModuleConstants.cs` — `CustomerOrderStatus` + `Settings.General.OrderStatus` (`IsDictionary=true`, `AllowedValues` = the 8 seed values incl. `Processing`) + `OrderInitialStatus` (default `New`) / `OrderInitialProcessingStatus` (default `Processing`). Docs: PlatformUserGuide "Order management → Settings → General settings" (order statuses are admin-configurable). Live-verified: an order persists in `Processing`, shown in the editable Status control.'
      - kind: doc
        ref: platform/user-guide/docs/order-management/settings.md (published) — General settings let administrators define order, shipment and payment statuses.
      - kind: doc
        ref: platform/developer-guide/docs/GraphQL-Storefront-API-Reference-xAPI/Order/queries/orderStatuses.md (published) — order statuses are returned as localized key/value dictionary items.
    check:
      kind: manual
      ref: Open Admin → Orders → any order → the Status dropdown lists the deployment's configured `Order.Status` dictionary values, with `Processing` among the selectable options. Set an `AGENT-TEST-` order to `Processing` → Save → reopen → status persists as `Processing` in the editable Status control. Confirm the settable set matches Settings → Orders → General settings → order status dictionary.
    violation_signal: Status dropdown does not reflect the `Order.Status` dictionary; a configured dictionary value is missing from the dropdown; a saved value does not persist; storefront shows the raw system value (`ReadyForPickup`) instead of the localized label.
    status: ACTIVE
    history: docs/decisions/bl/ord.md#bl-ord-009
  - id: BL-ORD-008
    title: Audit trail completeness
    rule: "Every order state change (status, payment, shipment) must be recorded in the order's change log with: actor (user/system), timestamp, previous state, and new state. The audit trail is append-only — entries cannot be edited or deleted. Admin users can view the full change log from the order detail blade."
    priority: P1-data
    trust: DECLARED
    source:
      - kind: resolution
        ref: VP-8193 (Done) — fixed order change logs not shown in the admin Changes widget (searchChanges) for older orders.
      - kind: resolution
        ref: VP-4321 (Done) — fixed audit/change-log records written from background jobs recording an unknown user instead of the real actor.
      - kind: doc
        ref: platform/user-guide/docs/order-management/settings.md (published) — General settings include enabling order change logging.
    check:
      kind: manual
      ref: "Place order → authorize → capture → ship → deliver. Open order change log in Admin → every transition recorded with correct actor and timestamps. Verify via API: `GET /api/order/customerOrders/{id}/changes` returns full history."
    violation_signal: Missing entries in change log; actor shows "system" for manual actions; timestamps out of order; change log entries editable.
    status: ACTIVE
    history: docs/decisions/bl/ord.md#bl-ord-008
  - id: BL-ORD-010
    title: Order totals — one entry per distinct line currency, unique default-currency flag
    rule: "`CustomerOrder.OrderTotals[]` MUST contain exactly one entry per distinct currency present across `Items[].Currency`, `Shipments[].Currency`, and `InPayments[].Currency`. The entry whose `CurrencyCode == CustomerOrder.Currency` MUST have `isDefaultTotalCurrency = true`; no other entry may. Each entry's `total/subTotal/taxTotal/discountTotal` reflect only that currency's entities. A single-currency order → exactly 1 entry. The REST `WithOrderTotals` response group (bit 9 = 512) must be requested; without it `OrderTotals` is null (not empty)."
    priority: P1-data
    trust: INFERRED
    source:
      - kind: code
        ref: "vc-module-order #497 `DefaultCustomerOrderTotalsCalculator.CalculateTotals` + `OrderTotal.cs`; vc-module-x-order #43 `CustomerOrderAggregate.OrderTotals` / `CustomerOrderType.cs:179`; live-verified 2026-06-22 on the environment. Covered by suites 075b/083b."
    check:
      kind: manual
      ref: Single-currency USD order → `order { orderTotals { isDefaultTotalCurrency total{currency{code}} } }` → exactly 1 entry, USD, `isDefaultTotalCurrency=true`. Mixed (USD + PTS) order → exactly 2 entries, exactly one `isDefaultTotalCurrency=true`, each subTotal = sum of its-currency lines. REST GET without `WithOrderTotals` → `orderTotals` null.
    violation_signal: Duplicate currency entries; zero or two `isDefaultTotalCurrency=true`; an entry's subtotal mixes currencies; `OrderTotals` populated without the flag requested.
    status: ACTIVE
    history: docs/decisions/bl/ord.md#bl-ord-010
